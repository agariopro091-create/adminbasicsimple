<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminAuto - Sistema de Inventario y Ventas de Autopartes</title>
    <meta name="description" content="AdminAuto - Sistema de gestión de inventario, catálogo y ventas de repuestos automotrices con compatibilidad vehicular." />
    <meta property="og:title" content="AdminAuto - Sistema de Inventario y Ventas de Autopartes" />
    <meta property="og:description" content="AdminAuto - Sistema de gestión de inventario, catálogo y ventas de repuestos automotrices con compatibilidad vehicular." />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Estilos iniciales */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          applyThemeToDOM("light");
        }
      })();
    </script>
    <script>
      (function () {
        // Filtrar advertencias irrelevantes de conexión WebSocket de Vite en iframe/proxy
        const originalError = console.error;
        console.error = function (...args) {
          const text = args.map(a => String(a?.message || a || '')).join(' ');
          if (/websocket|closed without opened|failed to connect to websocket/i.test(text)) {
            return;
          }
          originalError.apply(console, args);
        };

        window.addEventListener("unhandledrejection", function (event) {
          const reasonStr = String(event.reason?.message || event.reason || '');
          if (/websocket|closed without opened/i.test(reasonStr)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener("error", function (event) {
          const msg = String(event?.message || '');
          if (/websocket|closed without opened|failed to connect to websocket/i.test(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
          }
          if (window.self === window.top) return;
          var reported = {};
          var key = msg + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: msg.slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
                }
              },
              "*"
            );
          } catch (e) {}
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
